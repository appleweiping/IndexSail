name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
          components: clippy
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  # CodeQL covers source-level findings; this job independently audits the
  # locked Rust dependency graph against the RustSec advisory database.
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the dependency tree
        run: cargo audit --deny warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: matrix.os == 'ubuntu-latest'
        with:
          python-version: "3.11"
      - name: Verify the branch-gate parser contract
        if: matrix.os == 'ubuntu-latest'
        run: python -m unittest discover -s tests -p 'test_branch_coverage.py'
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Test
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release
      - name: Package manifest
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked --no-verify
      - name: Reproducible correctness benchmark
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --locked --release -- benchmark --documents 1000 --queries 30 --top-k 10 --seed 42 --json target/ci-benchmark.json
      - name: TREC adapter and evaluation smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- index --input examples/collection.trec --output target/ci.idx --format trec
          cargo run --locked --release -- batch --index target/ci.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci.run --report target/ci-report.json --field body --top-k 10 --verify
          cargo run --locked --release -- batch --index target/ci.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-bmms.run --report target/ci-bmms-report.json --field body --top-k 10 --strategy block-max-maxscore --verify
          diff -u target/ci.run target/ci-bmms.run
          grep -q '"schema_version": 3' target/ci-bmms-report.json
          test -s target/ci.run
          test -s target/ci-report.json
      - name: Elias–Fano persisted index lifecycle and ranking parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- index --input examples/collection.trec --output target/ci-ef.idx --format trec --codec elias-fano
          cargo run --locked --release -- inspect --index target/ci-ef.idx > target/ci-ef-inspect.txt
          cargo run --locked --release -- batch --index target/ci-ef.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-ef.run --report target/ci-ef-report.json --field body --top-k 10 --strategy block-max-wand --verify
          cargo run --locked --release -- batch --index target/ci.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-ef-reference.run --field body --top-k 10 --strategy block-max-wand --verify
          diff -u target/ci-ef-reference.run target/ci-ef.run
          cargo run --locked --release -- batch --index target/ci-ef.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-ef-bmms.run --field body --top-k 10 --strategy block-max-maxscore --verify
          diff -u target/ci-bmms.run target/ci-ef-bmms.run
          grep -q 'format=IndexSail-v4' target/ci-ef-inspect.txt
          grep -q 'posting_codec=elias-fano-docids+varbyte-positions' target/ci-ef-inspect.txt
          test -s target/ci-ef-report.json
      - name: Interpolative persisted index lifecycle and ranking parity
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- index --input examples/collection.trec --output target/ci-interpolative.idx --format trec --codec interpolative
          cargo run --locked --release -- inspect --index target/ci-interpolative.idx > target/ci-interpolative-inspect.txt
          cargo run --locked --release -- batch --index target/ci-interpolative.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-interpolative.run --report target/ci-interpolative-report.json --field body --top-k 10 --strategy block-max-wand --verify
          diff -u target/ci-ef-reference.run target/ci-interpolative.run
          cargo run --locked --release -- batch --index target/ci-interpolative.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-interpolative-bmms.run --field body --top-k 10 --strategy block-max-maxscore --verify
          diff -u target/ci-bmms.run target/ci-interpolative-bmms.run
          grep -q 'format=IndexSail-v5' target/ci-interpolative-inspect.txt
          grep -q 'posting_codec=interpolative-docids+varbyte-positions' target/ci-interpolative-inspect.txt
          test -s target/ci-interpolative-report.json
      - name: Forward index and JSONL collection lifecycle smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- forward-build --input examples/collection.jsonl --output target/ci.fwd --format jsonl
          cargo run --locked --release -- forward-inspect --index target/ci.fwd --document 0 --limit 10 | tee target/ci-forward-inspect.txt
          cargo run --locked --release -- lexicon --index target/ci.fwd --field body --term retrieval | tee target/ci-lexicon.txt
          cargo run --locked --release -- forward-invert --input target/ci.fwd --output target/ci-forward.idx
          cargo run --locked --release -- search --index target/ci-forward.idx --query "local retrieval" --field body --top-k 10 | tee target/ci-forward-search.txt
          cargo run --locked --release -- reorder --input target/ci.fwd --forward-output target/ci-reordered.fwd --index-output target/ci-reordered.idx --old-to-new target/ci-old-to-new.map --new-to-old target/ci-new-to-old.map --random --seed 42
          cargo run --locked --release -- search --index target/ci-reordered.idx --query "local retrieval" --field body --top-k 10 | tee target/ci-reordered-search.txt
          cargo run --locked --release -- reorder --input target/ci.fwd --forward-output target/ci-bp.fwd --index-output target/ci-bp.idx --old-to-new target/ci-bp-old-to-new.map --new-to-old target/ci-bp-new-to-old.map --bp --depth 2 --iterations 8
          cargo run --locked --release -- search --index target/ci-bp.idx --query "local retrieval" --field body --top-k 10 | tee target/ci-bp-search.txt
          test -s target/ci.fwd
          test -s target/ci-forward.idx
          test -s target/ci-reordered.fwd
          test -s target/ci-reordered.idx
          test -s target/ci-bp.fwd
          test -s target/ci-bp.idx
          test -s target/ci-old-to-new.map
          test -s target/ci-new-to-old.map
          grep -q 'documents=4' target/ci-forward-inspect.txt
          grep -q $'body\tretrieval' target/ci-lexicon.txt
          awk -F '\t' 'NR > 1 && $1 ~ /^[0-9]+$/ { print $3 "\t" $2 }' target/ci-forward-search.txt | LC_ALL=C sort > target/ci-forward-hits.txt
          awk -F '\t' 'NR > 1 && $1 ~ /^[0-9]+$/ { print $3 "\t" $2 }' target/ci-reordered-search.txt | LC_ALL=C sort > target/ci-reordered-hits.txt
          awk -F '\t' 'NR > 1 && $1 ~ /^[0-9]+$/ { print $3 "\t" $2 }' target/ci-bp-search.txt | LC_ALL=C sort > target/ci-bp-hits.txt
          test "$(wc -l < target/ci-forward-hits.txt)" -eq 2
          diff -u target/ci-forward-hits.txt target/ci-reordered-hits.txt
          diff -u target/ci-forward-hits.txt target/ci-bp-hits.txt
          cut -f1 target/ci-forward-hits.txt > target/ci-forward-ids.txt
          printf 'DOC-001\nDOC-002\n' > target/ci-expected-ids.txt
          diff -u target/ci-expected-ids.txt target/ci-forward-ids.txt
          test "$(wc -l < target/ci-old-to-new.map)" -eq 4
          test "$(wc -l < target/ci-new-to-old.map)" -eq 4
          printf '0 1\n1 3\n2 0\n3 2\n' > target/ci-expected-old-to-new.map
          diff -u target/ci-expected-old-to-new.map target/ci-old-to-new.map
          awk '{ print $2 " " $1 }' target/ci-old-to-new.map | sort -n -k1,1 > target/ci-expected-inverse.map
          diff -u target/ci-expected-inverse.map target/ci-new-to-old.map
          test "$(wc -l < target/ci-bp-old-to-new.map)" -eq 4
          awk '{ print $2 " " $1 }' target/ci-bp-old-to-new.map | sort -n -k1,1 > target/ci-bp-expected-inverse.map
          diff -u target/ci-bp-expected-inverse.map target/ci-bp-new-to-old.map
      - name: Sharded TREC lifecycle smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- shard-index --input examples/collection.trec --output target/ci-shards.idx --format trec --shards 3
          cargo run --locked --release -- shard-inspect --index target/ci-shards.idx --field body --term search
          cargo run --locked --release -- shard-batch --index target/ci-shards.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-shards.run --report target/ci-shards-report.json --field body --top-k 10 --strategy block-max-wand --verify
          cargo run --locked --release -- shard-batch --index target/ci-shards.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-shards-bmms.run --report target/ci-shards-bmms-report.json --field body --top-k 10 --strategy block-max-maxscore --verify
          diff -u target/ci-bmms.run target/ci-shards-bmms.run
          test -s target/ci-shards.idx
          test -s target/ci-shards.run
          test -s target/ci-shards-report.json
      - name: Quantized BM25 native and sharded release smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- index --input examples/corpus.tsv --output target/ci-quant.idx
          cargo run --locked --release -- shard-index --input examples/corpus.tsv --output target/ci-quant-shards.idx --shards 2
          cargo run --locked --release -- search --index target/ci-quant.idx --query "local search" --scorer qbm25 --quant-bits 8 --quant-max 5 --strategy block-max-wand > target/ci-quant-search.txt
          cargo run --locked --release -- batch --index target/ci-quant.idx --topics examples/topics.tsv --run target/ci-quant.run --report target/ci-quant.json --scorer qbm25 --quant-bits 8 --quant-max 5 --strategy maxscore --verify
          cargo run --locked --release -- shard-batch --index target/ci-quant-shards.idx --topics examples/topics.tsv --run target/ci-quant-shards.run --report target/ci-quant-shards.json --scorer qbm25 --quant-bits 8 --quant-max 5 --strategy maxscore --verify
          cargo run --locked --release -- batch --index target/ci-quant.idx --topics examples/topics.tsv --run target/ci-quant-bmms.run --report target/ci-quant-bmms.json --scorer qbm25 --quant-bits 8 --quant-max 5 --strategy block-max-maxscore --verify
          cargo run --locked --release -- shard-batch --index target/ci-quant-shards.idx --topics examples/topics.tsv --run target/ci-quant-shards-bmms.run --report target/ci-quant-shards-bmms.json --scorer qbm25 --quant-bits 8 --quant-max 5 --strategy block-max-maxscore --verify
          diff -u target/ci-quant-bmms.run target/ci-quant-shards-bmms.run
          grep -q '"schema_version": 4' target/ci-quant-bmms.json
          test -s target/ci-quant-search.txt
          test -s target/ci-quant.run
          diff -u target/ci-quant.run target/ci-quant-shards.run
          grep -q '"scorer": "qbm25"' target/ci-quant.json
          grep -q '"verified_exact": true' target/ci-quant-shards.json
      - name: CIFF interoperability lifecycle smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- ciff-export --index target/ci.idx --output target/ci.ciff --description "CI fixture"
          cargo run --locked --release -- ciff-inspect --index target/ci.ciff --term search
          cargo run --locked --release -- ciff-search --index target/ci.ciff --query "local search" --top-k 10
          cargo run --locked --release -- ciff-batch --index target/ci.ciff --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-ciff.run --report target/ci-ciff-report.json --top-k 10
          test -s target/ci.ciff
          test -s target/ci-ciff.run
          test -s target/ci-ciff-report.json
          grep -q '"strategy": "exhaustive"' target/ci-ciff-report.json
          grep -q '"map": 1.000000000000' target/ci-ciff-report.json

  # Keep the stable Linux/Windows matrix above independent of nightly-only
  # branch instrumentation. The checked-in parser validates the complete
  # llvm-cov JSON source-file set and fails closed below the 90% gate.
  branch-coverage:
    name: Nightly source branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: nightly-2026-09-18
          components: llvm-tools-preview
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install pinned branch-coverage driver
        run: cargo install cargo-llvm-cov --version 0.9.1 --locked
      - name: Run every Rust target and export actual source branches
        run: cargo llvm-cov --branch --locked --all-targets --json --output-path target/branch-coverage.json
      - name: Enforce fail-closed source branch gate
        run: python scripts/check_branch_coverage.py target/branch-coverage.json
