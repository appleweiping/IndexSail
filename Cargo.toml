[package]
name = "indexsail"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic BM25, sharded retrieval, WAND, and TREC experiment toolkit"
authors = ["Weiping Yan"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/appleweiping/IndexSail"
homepage = "https://github.com/appleweiping/IndexSail"
keywords = ["search", "information-retrieval", "bm25", "inverted-index", "trec"]
categories = ["command-line-utilities", "database-implementations"]

[lib]
name = "indexsail"
path = "src/lib.rs"

[[bin]]
name = "indexsail"
path = "src/main.rs"

[dependencies]
libm = { version = "=0.2.16", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"

[lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
