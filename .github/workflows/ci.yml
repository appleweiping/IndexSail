name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - run: cargo test --locked --all-targets

  # CodeQL covers source-level findings; this job independently audits the
  # locked Rust dependency graph against the RustSec advisory database.
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit the dependency tree
        run: cargo audit --deny warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Test
        run: cargo test --locked --all-targets
      - name: Release build
        run: cargo build --locked --release
      - name: Package manifest
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --locked --no-verify
      - name: Reproducible correctness benchmark
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --locked --release -- benchmark --documents 1000 --queries 30 --top-k 10 --seed 42 --json target/ci-benchmark.json
      - name: TREC adapter and evaluation smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- index --input examples/collection.trec --output target/ci.idx --format trec
          cargo run --locked --release -- batch --index target/ci.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci.run --report target/ci-report.json --field body --top-k 10 --verify
          test -s target/ci.run
          test -s target/ci-report.json
      - name: Forward index and JSONL collection lifecycle smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- forward-build --input examples/collection.jsonl --output target/ci.fwd --format jsonl
          cargo run --locked --release -- forward-inspect --index target/ci.fwd --document 0 --limit 10 | tee target/ci-forward-inspect.txt
          cargo run --locked --release -- lexicon --index target/ci.fwd --field body --term retrieval | tee target/ci-lexicon.txt
          cargo run --locked --release -- forward-invert --input target/ci.fwd --output target/ci-forward.idx
          cargo run --locked --release -- search --index target/ci-forward.idx --query "local retrieval" --field body --top-k 10 | tee target/ci-forward-search.txt
          cargo run --locked --release -- reorder --input target/ci.fwd --forward-output target/ci-reordered.fwd --index-output target/ci-reordered.idx --old-to-new target/ci-old-to-new.map --new-to-old target/ci-new-to-old.map --random --seed 42
          cargo run --locked --release -- search --index target/ci-reordered.idx --query "local retrieval" --field body --top-k 10 | tee target/ci-reordered-search.txt
          test -s target/ci.fwd
          test -s target/ci-forward.idx
          test -s target/ci-reordered.fwd
          test -s target/ci-reordered.idx
          test -s target/ci-old-to-new.map
          test -s target/ci-new-to-old.map
          grep -q 'documents=4' target/ci-forward-inspect.txt
          grep -q $'body\tretrieval' target/ci-lexicon.txt
          awk -F '\t' 'NR > 1 && $1 ~ /^[0-9]+$/ { print $3 "\t" $2 }' target/ci-forward-search.txt | LC_ALL=C sort > target/ci-forward-hits.txt
          awk -F '\t' 'NR > 1 && $1 ~ /^[0-9]+$/ { print $3 "\t" $2 }' target/ci-reordered-search.txt | LC_ALL=C sort > target/ci-reordered-hits.txt
          test "$(wc -l < target/ci-forward-hits.txt)" -eq 2
          diff -u target/ci-forward-hits.txt target/ci-reordered-hits.txt
          cut -f1 target/ci-forward-hits.txt > target/ci-forward-ids.txt
          printf 'DOC-001\nDOC-002\n' > target/ci-expected-ids.txt
          diff -u target/ci-expected-ids.txt target/ci-forward-ids.txt
          test "$(wc -l < target/ci-old-to-new.map)" -eq 4
          test "$(wc -l < target/ci-new-to-old.map)" -eq 4
          printf '0 1\n1 3\n2 0\n3 2\n' > target/ci-expected-old-to-new.map
          diff -u target/ci-expected-old-to-new.map target/ci-old-to-new.map
          awk '{ print $2 " " $1 }' target/ci-old-to-new.map | sort -n -k1,1 > target/ci-expected-inverse.map
          diff -u target/ci-expected-inverse.map target/ci-new-to-old.map
      - name: Sharded TREC lifecycle smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- shard-index --input examples/collection.trec --output target/ci-shards.idx --format trec --shards 3
          cargo run --locked --release -- shard-inspect --index target/ci-shards.idx --field body --term search
          cargo run --locked --release -- shard-batch --index target/ci-shards.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-shards.run --report target/ci-shards-report.json --field body --top-k 10 --strategy block-max-wand --verify
          test -s target/ci-shards.idx
          test -s target/ci-shards.run
          test -s target/ci-shards-report.json
      - name: CIFF interoperability lifecycle smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --locked --release -- ciff-export --index target/ci.idx --output target/ci.ciff --description "CI fixture"
          cargo run --locked --release -- ciff-inspect --index target/ci.ciff --term search
          cargo run --locked --release -- ciff-search --index target/ci.ciff --query "local search" --top-k 10
          cargo run --locked --release -- ciff-batch --index target/ci.ciff --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci-ciff.run --report target/ci-ciff-report.json --top-k 10
          test -s target/ci.ciff
          test -s target/ci-ciff.run
          test -s target/ci-ciff-report.json
          grep -q '"strategy": "exhaustive"' target/ci-ciff-report.json
          grep -q '"map": 1.000000000000' target/ci-ciff-report.json
