name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  msrv:
    name: Minimum supported Rust 1.85
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.85.0
      - run: cargo test --all-targets

  # The Python repositories in this suite run CodeQL. CodeQL support for Rust is
  # still a preview, and this crate has no dependencies today, so `cargo audit`
  # against the RustSec database is the honest equivalent: it currently has
  # nothing to find, and it is what will catch an advisory the first time a
  # dependency is added rather than after one is.
  advisories:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the dependency tree
        run: cargo audit --deny warnings

  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-latest'
        run: cargo clippy --all-targets -- -D warnings
      - name: Documentation
        if: matrix.os == 'ubuntu-latest'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps
      - name: Test
        run: cargo test --all-targets
      - name: Release build
        run: cargo build --release
      - name: Package manifest
        if: matrix.os == 'ubuntu-latest'
        run: cargo package --no-verify
      - name: Reproducible correctness benchmark
        if: matrix.os == 'ubuntu-latest'
        run: cargo run --release -- benchmark --documents 1000 --queries 30 --top-k 10 --seed 42 --json target/ci-benchmark.json
      - name: TREC adapter and evaluation smoke test
        if: matrix.os == 'ubuntu-latest'
        run: |
          cargo run --release -- index --input examples/collection.trec --output target/ci.idx --format trec
          cargo run --release -- batch --index target/ci.idx --topics examples/topics.tsv --qrels examples/qrels.txt --run target/ci.run --report target/ci-report.json --field body --top-k 10 --verify
          test -s target/ci.run
          test -s target/ci-report.json
